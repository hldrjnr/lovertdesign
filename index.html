<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="preload" as="image" href="/icon-splash.png" fetchpriority="high" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lovert Design</title>
    <script>
      // tema da splash — lê o mesmo localStorage do App.tsx antes do paint
      (function(){
        try{
          var t = localStorage.getItem('thumbnail-app.base-theme') || localStorage.getItem('base-theme') || 'padrao';
          if(t!=='light' && t!=='dark' && t!=='padrao') t='padrao';
          document.documentElement.setAttribute('data-splash-theme', t);
        }catch(e){}
      })();
    </script>
    <style>
      /* splash — critical, inline para aparecer antes do JS */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a14;
        overflow: hidden;
        transition: opacity 0.32s ease;
      }
      #splash-bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(1100px 600px at 50% -10%, rgba(59,130,246,0.22) 0%, transparent 62%),
          radial-gradient(820px 480px at 88% 92%, rgba(124,58,237,0.18) 0%, transparent 60%),
          radial-gradient(700px 420px at 8% 88%, rgba(59,130,246,0.12) 0%, transparent 65%),
          linear-gradient(180deg, #0f1024 0%, #0a0a14 100%);
      }
      #splash-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.35) 0, transparent 100%),
                    radial-gradient(1px 1px at 75% 22%, rgba(255,255,255,0.25) 0, transparent 100%),
                    radial-gradient(1px 1px at 42% 78%, rgba(255,255,255,0.2) 0, transparent 100%);
        opacity: 0.45;
      }
      .splash-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        text-align: center;
        animation: splashIn 0.42s cubic-bezier(0.16,1,0.3,1) both;
      }
      .splash-icon-wrap {
        position: relative;
        width: 128px;
        height: 128px;
        border-radius: 26px;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 10px 36px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.04) inset, 0 0 56px rgba(59,130,246,0.18);
      }
      .splash-icon-wrap::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: 26px;
        padding: 1px;
        background: linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0.02));
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }
      .splash-icon {
        width: 88px;
        height: 88px;
        object-fit: contain;
        display: block;
        filter: drop-shadow(0 2px 12px rgba(0,0,0,0.35));
      }
      .splash-title {
        margin: 2px 0 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        font-size: 36px;
        font-weight: 800;
        letter-spacing: -0.035em;
        line-height: 1;
        color: #ffffff;
        text-shadow: 0 1px 24px rgba(59,130,246,0.25);
      }
      .splash-by {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.52);
      }
      .splash-by span {
        color: rgba(255,255,255,0.86);
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: none;
      }
      .splash-line {
        width: 32px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
        margin-top: 2px;
      }
      /* tema claro — respeita o escolhido em Configurações */
      html[data-splash-theme="light"] #splash { background: #f4f4f5; }
      html[data-splash-theme="light"] #splash-bg {
        background:
          radial-gradient(1100px 600px at 50% -10%, rgba(59,130,246,0.10) 0%, transparent 62%),
          radial-gradient(820px 480px at 88% 92%, rgba(124,58,237,0.09) 0%, transparent 60%),
          linear-gradient(180deg, #ffffff 0%, #f4f4f5 100%);
      }
      html[data-splash-theme="light"] #splash-bg::after { opacity: 0.18; }
      html[data-splash-theme="light"] .splash-icon-wrap {
        background: #ffffff;
        border-color: #e4e4e7;
        box-shadow: 0 10px 32px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.04) inset;
      }
      html[data-splash-theme="light"] .splash-icon-wrap::before { display: none; }
      html[data-splash-theme="light"] .splash-title { color: #18181b; text-shadow: none; }
      html[data-splash-theme="light"] .splash-by { color: rgba(24,24,27,0.52); }
      html[data-splash-theme="light"] .splash-by span { color: #18181b; }
      html[data-splash-theme="light"] .splash-line { background: linear-gradient(90deg, transparent, rgba(0,0,0,0.14), transparent); }
      /* padrao ligeiramente mais claro que dark */
      html[data-splash-theme="padrao"] #splash { background: #11111d; }
      html[data-splash-theme="padrao"] #splash-bg {
        background:
          radial-gradient(1100px 600px at 50% -10%, rgba(59,130,246,0.18) 0%, transparent 62%),
          radial-gradient(820px 480px at 88% 92%, rgba(124,58,237,0.14) 0%, transparent 60%),
          linear-gradient(180deg, #17172a 0%, #11111d 100%);
      }
      @keyframes splashIn {
        from { opacity: 0; transform: translateY(8px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-content { animation: none; }
        #splash { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div id="splash-bg"></div>
      <div class="splash-content">
        <div class="splash-icon-wrap">
          <img src="/icon-splash.png" alt="" class="splash-icon" width="88" height="88" />
        </div>
        <h1 class="splash-title">Lovert Design</h1>
        <p class="splash-by">by <span>HldrJnr</span></p>
        <div class="splash-line"></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      window.__hideSplash = function() {
        var el = document.getElementById('splash');
        if (!el || el.dataset.hiding) return;
        el.dataset.hiding = '1';
        el.style.opacity = '0';
        el.style.pointerEvents = 'none';
        setTimeout(function(){ if(el && el.parentNode) el.parentNode.removeChild(el); }, 360);
      };
      setTimeout(function(){ window.__hideSplash(); }, 1800);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
